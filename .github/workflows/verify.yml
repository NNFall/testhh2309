name: Verify showcase

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Run tests
        run: python -m pytest -q
      - name: Build container
        run: docker build -t quote-showcase .
      - name: Start with assignment limits
        run: >-
          docker run -d --name quote-showcase
          --memory=256m --memory-swap=256m --cpus=0.5 --pids-limit=64
          --tmpfs /tmp:rw,size=64m,noexec
          -p 8000:8000 quote-showcase
      - name: Wait for health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs quote-showcase
          exit 1
      - name: Import two maximum-size snapshots
        run: python benchmarks/stress_import.py --count 340000 --random-bytes 180 --repeats 2
      - name: Import repeated snapshots with long random IDs
        run: python benchmarks/stress_import.py --count 340000 --random-bytes 0 --id-random-bytes 174 --repeats 5
      - name: Inspect container limits and memory
        if: always()
        run: |
          docker stats --no-stream quote-showcase || true
          docker inspect --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' quote-showcase || true
          docker logs --tail 100 quote-showcase || true
      - name: Stop container
        if: always()
        run: docker rm -f quote-showcase || true
